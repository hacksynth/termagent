<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>TermAgent — UI preview</title>
<style>
/* ------------------------------------------------------------------ palette
   Mirrors com.termagent.ui.theme.TermAgentPalette (Theme.kt) exactly.       */
:root{
  --background:#0B0F14; --sidebar:#11161C; --sidebar-selected:#1C232B;
  --surface:#161C23; --surface-elevated:#1E252E; --accent:#4C9AFF; --on-accent:#fff;
  --user-bubble:#222B36; --on-user-bubble:#E6EDF3;
  --text-primary:#E6EDF3; --text-secondary:#9BA7B4; --text-faint:#6B7684;
  --divider:#222A33;
  --term-bg:#0D1117; --term-header:#161B22; --term-border:#30363D; --term-text:#C9D1D9;
  --success:#3FB950; --danger:#F85149; --warning:#D29922;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --background:#F7F8FA; --sidebar:#EFEFEF; --sidebar-selected:#E0E3E8;
  --surface:#FFFFFF; --surface-elevated:#FFFFFF; --accent:#1A73E8; --on-accent:#fff;
  --user-bubble:#E8EAED; --on-user-bubble:#1F1F1F;
  --text-primary:#1F1F1F; --text-secondary:#5F6368; --text-faint:#80868B;
  --divider:#DDDFE3;
  --term-bg:#1E1E1E; --term-header:#2D2D2D; --term-border:#3C3C3C; --term-text:#D4D4D4;
  --success:#1A7F37; --danger:#CF222E; --warning:#9A6700;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--background);color:var(--text-primary);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-elevated);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------------------------------------------ shell */
.app{display:flex;height:100dvh;overflow:hidden}

/* sidebar ---------------------------------------------------------------- */
.sidebar{
  width:300px;flex:0 0 300px;display:flex;flex-direction:column;
  background:var(--sidebar);border-right:1px solid var(--divider);
  z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.logo{
  width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto;
}
.brand-name{font-size:16px;font-weight:600;line-height:1.2}
.brand-sub{font-size:11px;color:var(--success)}
.brand-sub.warn{color:var(--warning)}

.newchat{
  display:flex;align-items:center;gap:8px;margin:0 12px;padding:11px 12px;
  background:var(--surface);border-radius:10px;font-size:14px;width:calc(100% - 24px);
  transition:background .15s;
}
.newchat:hover{background:var(--sidebar-selected)}
.section-label{
  font-size:10px;letter-spacing:.08em;color:var(--text-faint);font-weight:600;
  padding:16px 16px 6px;
}
.chatlist{flex:1;overflow-y:auto;padding:0 8px 12px}
.chat{
  display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:8px;
  cursor:pointer;transition:background .12s;
}
.chat:hover{background:var(--sidebar-selected)}
.chat.active{background:var(--sidebar-selected)}
.chat-body{flex:1;min-width:0}
.chat-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--text-faint)}
.icon{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-secondary);flex:0 0 auto;transition:background .12s,color .12s;
}
.icon:hover{background:var(--surface-elevated);color:var(--text-primary)}
.icon svg{width:18px;height:18px;display:block}
.icon.sm svg{width:15px;height:15px}
.side-foot{
  display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--divider);
}
.foot-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 8px;border-radius:9px;font-size:13px;color:var(--text-secondary);
  transition:background .12s;
}
.foot-btn:hover{background:var(--surface-elevated);color:var(--text-primary)}
.foot-btn.on{background:var(--surface-elevated);color:var(--accent)}

/* main ------------------------------------------------------------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--background)}
.topbar{
  display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid transparent;
}
.topbar .title{flex:1;min-width:0;padding-left:4px}
.topbar .title strong{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title span{font-size:11px;color:var(--accent)}
.pane{flex:1;overflow-y:auto;padding:8px 16px 16px}
.wrap{max-width:760px;margin:0 auto;width:100%}
.msg+.msg{margin-top:24px}

/* user bubble ------------------------------------------------------------ */
.user-row{display:flex;justify-content:flex-end}
.bubble{
  max-width:520px;background:var(--user-bubble);color:var(--on-user-bubble);
  border-radius:16px;padding:12px 16px;
}

/* assistant -------------------------------------------------------------- */
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{
  width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-size:12px;font-weight:700;
}
.msg-head .name{font-size:13px;font-weight:600;flex:1}
.prose{white-space:pre-wrap}
.prose code{
  font-family:var(--mono);font-size:.86em;background:var(--surface-elevated);
  padding:1px 5px;border-radius:4px;
}
.prose h3{font-size:15px;margin:14px 0 6px}

/* terminal card ---------------------------------------------------------- */
.tcard{
  margin-top:10px;background:var(--term-bg);border-radius:12px;overflow:hidden;
  border:1px solid var(--term-border);
}
.tcard-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--term-header);
}
.dot{width:8px;height:8px;border-radius:4px;flex:0 0 auto}
.dot.run{background:var(--warning);animation:pulse 1.1s ease-in-out infinite}
.dot.ok{background:var(--success)}
.dot.fail{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tcard-cmd{
  flex:1;font-family:var(--mono);font-size:12px;color:var(--term-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.exit{font-family:var(--mono);font-size:11px;color:var(--success)}
.exit.fail{color:var(--danger)}
.tcard-body{
  margin:0;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.45;
  color:var(--term-text);max-height:320px;overflow-y:auto;white-space:pre-wrap;
  word-break:break-word;
}
.tcard.collapsed .tcard-body{display:none}

/* code block ------------------------------------------------------------- */
.cblock{margin-top:12px;background:var(--term-bg);border-radius:10px;overflow:hidden}
.cblock-head{
  display:flex;align-items:center;padding:2px 6px 2px 12px;background:var(--term-header);
}
.cblock-head span{flex:1;font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.cblock pre{
  margin:0;padding:12px;font-family:var(--mono);font-size:12px;line-height:1.5;
  color:var(--term-text);overflow-x:auto;
}
.cursor{display:inline-block;width:8px;height:1em;background:var(--accent);
  vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* thinking --------------------------------------------------------------- */
.thinking{display:flex;align-items:center;gap:8px;color:var(--text-faint);font-size:12px}
.spinner{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-elevated);
  border-top-color:var(--accent);animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty / cards ---------------------------------------------------------- */
.center{height:100%;display:grid;place-items:center;padding:24px}
.hero{text-align:center;max-width:520px}
.hero .logo{width:56px;height:56px;border-radius:16px;font-size:26px;margin:0 auto 16px}
.hero h2{margin:0 0 8px;font-size:20px}
.hero p{margin:0 0 16px;color:var(--text-secondary);font-size:13px}
.hero ul{margin:0;padding:0;list-style:none;text-align:left}
.hero li{
  font-family:var(--mono);font-size:12px;color:var(--text-faint);padding:3px 0;
}
.card{
  background:var(--surface);border-radius:14px;border:1px solid var(--divider);
  padding:18px;max-width:520px;width:100%;
}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 16px;color:var(--text-secondary);font-size:13px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);color:var(--on-accent);border-radius:10px;padding:11px 16px;
  font-size:14px;font-weight:500;
}
.btn:disabled{opacity:.55}
.hint{font-size:11px;color:var(--text-faint);margin-top:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:5px}
.field input{
  width:100%;background:var(--background);border:1px solid var(--divider);
  border-radius:9px;padding:11px 12px;color:var(--text-primary);
  font-family:var(--mono);font-size:13px;outline:none;
}
.field input:focus{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.row .grow{flex:1;min-width:0}
.row .row-sub{font-size:11px;color:var(--text-faint)}
.switch{
  width:44px;height:26px;border-radius:13px;background:var(--surface-elevated);
  position:relative;flex:0 0 auto;transition:background .18s;
}
.switch.on{background:var(--accent)}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .18s;
}
.switch.on::after{transform:translateX(18px)}
.info{display:flex;align-items:center;gap:12px;font-size:13px;padding:6px 0}
.info .grow{flex:1;color:var(--text-secondary)}
.info .val{font-family:var(--mono);font-size:12px;color:var(--success)}
.o-option{padding:10px 0;font-size:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.radio{width:18px;height:18px;border-radius:50%;background:var(--surface-elevated);flex:0 0 auto}
.radio.sel{background:var(--accent)}
.danger{color:var(--danger)}

/* fake PTY --------------------------------------------------------------- */
.pty{
  flex:1;background:var(--term-bg);margin:0 8px 8px;border-radius:12px;
  padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.5;
  color:var(--term-text);overflow-y:auto;white-space:pre-wrap;
}
.pty .p1{color:#7EE787}.pty .p2{color:#79C0FF}.pty .p3{color:#D2A8FF}
.pty .dim{color:#8B949E}

/* composer --------------------------------------------------------------- */
.composer{padding:12px 16px 16px}
.composer-inner{max-width:760px;margin:0 auto}
.inputbar{
  display:flex;align-items:flex-end;gap:8px;background:var(--surface);
  border:1px solid var(--divider);border-radius:18px;padding:8px 8px 8px 16px;
  transition:border-color .15s;
}
.inputbar:focus-within{border-color:var(--accent)}
.inputbar textarea{
  flex:1;background:none;border:0;outline:none;resize:none;color:var(--text-primary);
  font-family:var(--sans);font-size:15px;line-height:1.45;max-height:160px;
  padding:10px 0;
}
.inputbar textarea::placeholder{color:var(--text-faint)}
.send{
  width:40px;height:40px;border-radius:12px;background:var(--surface-elevated);
  color:var(--text-faint);display:grid;place-items:center;flex:0 0 auto;
  transition:background .15s,color .15s;
}
.send.ready{background:var(--accent);color:var(--on-accent)}
.send.stop{background:var(--danger);color:#fff}
.send svg{width:18px;height:18px}
.meta{
  display:flex;align-items:center;gap:8px;padding:8px 4px 0;font-size:11px;
  color:var(--text-faint);
}
.meta .model{font-family:var(--mono)}
.meta .grow{flex:1}
.errbar{
  display:flex;align-items:center;gap:8px;margin:0 16px 8px;padding:8px 8px 8px 12px;
  background:color-mix(in srgb,var(--danger) 15%,transparent);border-radius:10px;
  font-size:12px;color:var(--danger);
}
.errbar .grow{flex:1}
.errbar button{color:var(--danger);font-size:12px;padding:4px 8px}

/* layout / mobile -------------------------------------------------------- */
.scrim{display:none}
@media (max-width:820px){
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);
    transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 40px rgba(0,0,0,.4);
  }
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .hamburger{display:grid!important}
}
@media (min-width:821px){ .hamburger{display:none!important} }

/* preview banner --------------------------------------------------------- */
.preview-note{
  position:fixed;right:12px;bottom:12px;z-index:60;max-width:290px;
  background:var(--surface);border:1px solid var(--divider);border-radius:12px;
  padding:10px 12px;font-size:11px;color:var(--text-secondary);line-height:1.5;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.preview-note b{color:var(--text-primary)}
.preview-note button{position:absolute;top:4px;right:6px;color:var(--text-faint);font-size:14px}
</style>
</head>
<body>

<div class="app">
  <!-- ============================== SIDEBAR ============================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <div class="brand-name">TermAgent</div>
        <div class="brand-sub" id="brandSub">shell ready</div>
      </div>
    </div>

    <button class="newchat" id="btnNewChat">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="section-label">CHATS</div>
    <div class="chatlist" id="chatList"></div>

    <div class="side-foot">
      <button class="foot-btn" id="btnTerminal" title="Open the live PTY">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 9l3 3-3 3M12 15h5"/></svg>
        Terminal
      </button>
      <button class="foot-btn" id="btnSettings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- =============================== MAIN =============================== -->
  <main class="main">
    <div class="topbar">
      <button class="icon hamburger" id="btnMenu" title="Sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M10 4v16"/></svg>
      </button>
      <div class="title">
        <strong id="paneTitle">Disk usage check</strong>
        <span id="paneSub"></span>
      </div>
      <button class="icon" id="btnTheme" title="Toggle light / dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button class="icon" id="btnNewChat2" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon" id="btnSettings2" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>

    <div class="pane" id="pane"></div>

    <div class="composer" id="composer">
      <div class="composer-inner">
        <div class="inputbar">
          <textarea id="input" rows="1" placeholder="Ask TermAgent to run something…"></textarea>
          <button class="send" id="btnSend" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
          </button>
        </div>
        <div class="meta">
          <span class="model" id="modelLabel">gpt-4o-mini</span>
          <span class="grow"></span>
          <span id="metaHint">Enter to send</span>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="preview-note" id="previewNote">
  <button onclick="document.getElementById('previewNote').remove()">×</button>
  <b>TermAgent UI preview</b><br>
  A static mock of the Compose + Miuix screens
  (<code>docs/ui-preview.html</code>).
  Tap the hamburger, <b>Settings</b>, <b>Terminal</b>, or send a message to
  see the streaming behaviour.
</div>

<script>
// --------------------------------------------------------------------------
// Data (mirrors com.termagent.data.Models)
// --------------------------------------------------------------------------
const chats = [
  { id:'1', title:'Disk usage check',  time:'2m ago'  },
  { id:'2', title:'Rename photos by date', time:'3h ago' },
  { id:'3', title:'Git repo status',   time:'Aug 4'   },
];

const DF_OUTPUT =
`Filesystem      Size  Used Avail Use% Mounted on
/dev/block/dm-8 108G   71G   37G  66% /data/data

3 largest directories:
  42G  /sdcard/DCIM
  11G  /sdcard/Download
 4.2G  ~/projects`;

const LS_OUTPUT =
`total 28
drwx------  5 u0_a388 u0_a388 3452 Oct 11 21:48 .
drwx------  4 u0_a388 u0_a388 3452 Oct 11 21:43 ..
drwx------  2 u0_a388 u0_a388 3452 Oct 11 21:45 bin
-rw-r--r--  1 u0_a388 u0_a388  214 Oct 11 21:48 notes.md
drwx------  3 u0_a388 u0_a388 3452 Oct 11 21:46 projects`;

const PROMPT_1 = "check how much disk space is left and tell me what's using the most";
const PROMPT_2 = "list my home directory too";

// --------------------------------------------------------------------------
// Pane rendering
// --------------------------------------------------------------------------
const pane = document.getElementById('pane');
const composer = document.getElementById('composer');
const paneTitle = document.getElementById('paneTitle');
const paneSub = document.getElementById('paneSub');
let streaming = false;

const ESC = (s)=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function terminalCard(cmd, output, status, exitCode){
  return `
  <div class="tcard" data-card>
    <div class="tcard-head">
      <span class="dot ${status}"></span>
      <span class="tcard-cmd">$ ${ESC(cmd)}</span>
      <span class="exit ${exitCode === 0 ? '' : 'fail'}" data-exit hidden>exit ${exitCode}</span>
      <button class="icon sm" data-copy="$" title="Copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>

// --------------------------------------------------------------------------
// Streaming helpers
// --------------------------------------------------------------------------
function typeInto(el, text, speed, done){
  el.innerHTML = '';
  let i = 0;
  const chunk = 3;
  (function step(){
    if (i >= text.length){
      el.innerHTML = fancy(text);
      done && done();
      return;
    }
    i = Math.min(text.length, i + chunk);
    el.innerHTML = fancy(text.slice(0, i)) + '<span class="cursor"></span>';
    const c = el.closest('.tcard-body') || el;
    c.scrollTop = c.scrollHeight;
    const pane = document.getElementById('pane');
    pane.scrollTop = pane.scrollHeight;
    setTimeout(step, speed);
  })();
}

// tiny markdown: **bold**, `code`, newlines
function fancy(s){
  return ESC(s)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

function refreshSend(){
  const btn = document.getElementById('btnSend');
  const val = document.getElementById('input').value.trim();
  btn.classList.toggle('ready', val.length > 0 && !streaming);
  btn.classList.toggle('stop', streaming);
  btn.title = streaming ? 'Stop' : 'Send';
  document.getElementById('metaHint').textContent = streaming ? 'Generating…' : 'Enter to send';
}

function showComposer(on){

function buildChatList(activeId){
  const list = document.getElementById('chatList');
  list.innerHTML = chats.map(c => `
    <div class="chat ${c.id === activeId ? 'active' : ''}" data-chat="${c.id}">
      <div class="chat-body">
        <div class="chat-title">${ESC(c.title)}</div>
        <div class="chat-time">${ESC(c.time)}</div>
      </div>
      <button class="icon sm" data-del="${c.id}" title="Delete chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </button>
    </div>`).join('');

  list.querySelectorAll('[data-chat]').forEach(el =>
    el.onclick = e => {
      if (e.target.closest('[data-del]')) return;
      buildChatList(el.dataset.chat);
      paneTitle.textContent = chats.find(c => c.id === el.dataset.chat).title;
      closeDrawer();
      renderChat();
    });
  list.querySelectorAll('[data-del]').forEach(el =>
    el.onclick = e => {
      e.stopPropagation();
      const i = chats.findIndex(c => c.id === el.dataset.del);
      if (i >= 0) chats.splice(i, 1);
      buildChatList(null);
    });
}

// copy / collapse handlers (event delegation)
pane.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]');
  if (copy){
    const card = copy.closest('.tcard, .cblock');
    const text = card.querySelector('pre').innerText;
    navigator.clipboard?.writeText(text);
    copy.style.color = 'var(--success)';
    setTimeout(() => copy.style.color = '', 700);
    return;
  }
  const col = e.target.closest('[data-collapse]');
  if (col) col.closest('.tcard').classList.toggle('collapsed');
});

// composer
const input = document.getElementById('input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(160, input.scrollHeight) + 'px';
  refreshSend();
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.getElementById('btnSend').onclick = () => { streaming ? stop() : send(); };

function send(){
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = ''; input.style.height = 'auto';
  streaming = true; refreshSend();
  paneTitle.textContent = text.slice(0, 40);

  // append the user's bubble + a thinking row, then stream a reply
  pane.innerHTML = `
    <div class="wrap">
      <div class="msg user-row"><div class="bubble">${ESC(text)}</div></div>
      <div class="msg"><div class="msg-head"><span class="badge">T</span><span class="name">TermAgent</span></div>
        <div class="prose" id="reply"></div></div>
    </div>`;
  const reply = pane.querySelector('#reply');
  typeInto(reply,
    "Running that in the persistent shell…\n\n" +
    "```\n$ " + text + "\n```\n\n" +
    "Plan acknowledged. In the real app this spawns a tool call, streams the command's " +
    "stdout into a terminal card, then feeds the exit status back to the model.",
    14, () => { streaming = false; refreshSend(); });
}

function stop(){ streaming = false; refreshSend(); }
