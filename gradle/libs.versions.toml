[versions]
# Toolchain — EXACTLY mirrors the versions used by the Miuix 0.9.4 build itself.
# These are not optional: Compose 1.12 AARs declare `minAndroidGradlePluginVersion=9.1.0`,
# so AGP must be >= 9.1 and therefore Gradle must be >= 9.0.
agp = "9.4.1"
kotlin = "2.4.21"
javaTarget = "17"

# Android SDK
compileSdk = "37"
targetSdk = "36"
minSdk = "24"
buildTools = "37.0.0"
ndk = "27.0.12077973"
cmake = "3.22.1"

# AndroidX (KMP org.jetbrains.compose:foundation-android:1.12.0 redirects to these)
coreKtx = "1.17.0"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
annotation = "1.9.1"
profileinstaller = "1.4.1"

# Compose — pinned to what Miuix 0.9.4 resolves to on Android.
# NOTE: Miuix 0.9.4 declares minCompileSdk=37 (its own build uses COMPILE_SDK=37), which is why
# compileSdk is 37 here. Platform 37 currently ships as the `android-canary-*` SDK package.
# (org.jetbrains.compose.foundation:foundation-android:1.12.0 -> androidx.compose.foundation:foundation-android:1.12.0)
compose = "1.12.0"

# Miuix (Compose Multiplatform UI library, resolves to androidx compose on Android)
miuix = "0.9.4"

# Networking / serialization / coroutines
okhttp = "4.12.0"
kotlinxSerialization = "1.11.0"
coroutines = "1.10.2"

# Test
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }

miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
miuix-squircle = { module = "top.yukonga.miuix.kmp:miuix-squircle", version.ref = "miuix" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
